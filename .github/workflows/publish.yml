name: Publish VSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish only when this workflow is dispatched from a matching vX.Y.Z tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-vsix:
    uses: ./.github/workflows/verify-vsix.yml

  publish:
    name: Publish exact verified artifact
    needs: verify-vsix
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Require release tag on main history
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked publishing toolchain
        run: npm ci

      - name: Download verified VSIX artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: txtjet-syntax-vsix
          path: artifact

      - name: Verify tag, artifact name, and checksum
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifact -maxdepth 1 -type f -name '*.vsix' -print)
          test "${#packages[@]}" -eq 1
          vsix="${packages[0]}"
          node scripts/check-release-metadata.js --tag "$GITHUB_REF_NAME" --vsix "$vsix"
          (cd artifact && sha256sum -c "$(basename "$vsix").sha256")
          release_version=$(node -p "require('./package.json').version")
          extension_id=$(node -p "const manifest = require('./package.json'); manifest.publisher + '.' + manifest.name")
          echo "VSIX_PATH=$vsix" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "EXTENSION_ID=$extension_id" >> "$GITHUB_ENV"

      - name: Create or verify draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if release_is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$release_is_draft" = "true" ]; then
              gh release upload "$GITHUB_REF_NAME" "$VSIX_PATH" "$VSIX_PATH.sha256" --clobber
              echo "RELEASE_ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
            else
              release_assets=$(mktemp -d)
              gh release download "$GITHUB_REF_NAME" \
                --pattern "$(basename "$VSIX_PATH")" \
                --pattern "$(basename "$VSIX_PATH.sha256")" \
                --dir "$release_assets"
              cmp "$VSIX_PATH" "$release_assets/$(basename "$VSIX_PATH")"
              cmp "$VSIX_PATH.sha256" "$release_assets/$(basename "$VSIX_PATH.sha256")"
              echo "RELEASE_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              "$VSIX_PATH" \
              "$VSIX_PATH.sha256" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "JetForge ${GITHUB_REF_NAME#v}"
            echo "RELEASE_ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
          fi

      - name: Inspect Marketplace version
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install vsce show "$EXTENSION_ID" --json > marketplace-extension.json
          marketplace_state=$(node - "$RELEASE_VERSION" "$VSIX_PATH.sha256" <<'NODE'
          const { readFileSync } = require("node:fs");
          const expectedVersion = process.argv[2];
          const checksumPath = process.argv[3];
          const metadata = JSON.parse(readFileSync("marketplace-extension.json", "utf8"));
          const published = metadata.versions?.find((entry) => entry.version === expectedVersion);
          if (!published) {
            process.stdout.write("missing");
            process.exit(0);
          }
          const publishedChecksum = published.properties?.find(
            (property) => property.key === "Microsoft.VisualStudio.Services.VsixSha256"
          )?.value?.toLowerCase();
          const localChecksum = readFileSync(checksumPath, "utf8").trim().split(/\s+/)[0]?.toLowerCase();
          process.stdout.write(publishedChecksum && publishedChecksum === localChecksum ? "exact" : "mismatch");
          NODE
          )
          case "$marketplace_state" in
            exact)
              echo "MARKETPLACE_ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
              ;;
            missing)
              echo "MARKETPLACE_ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Marketplace already contains $EXTENSION_ID@$RELEASE_VERSION with a different VSIX checksum." >&2
              exit 1
              ;;
          esac

      - name: Require Marketplace credential
        if: env.MARKETPLACE_ALREADY_PUBLISHED != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: test -n "$VSCE_PAT"

      - name: Publish verified artifact to Visual Studio Marketplace
        if: env.MARKETPLACE_ALREADY_PUBLISHED != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath "$VSIX_PATH"

      - name: Publish GitHub Release
        if: env.RELEASE_ALREADY_PUBLISHED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
